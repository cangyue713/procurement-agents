[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agents"
version = "0.2.0"
description = "供应链/采购流程自动化多Agent项目：需求理解→策略判定→供应商推荐→报价解析→比价→合规→合同草稿，仲裁Agent全程监控"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "coverage[toml]>=7.5.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
procurement_agents = ["knowledge/data/*.json", "knowledge/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# ---------- 静态检查与质量门禁 ----------
[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# E/F/W 基础 + I 导入排序 + B 潜在错误 + RUF ruff 专属
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # 中文注释/字符串大量使用全角标点，忽略混淆字符检查

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
pretty = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/knowledge/data/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
